[package]
name = "fid-core"
version = "0.1.0"
edition = "2021"
description = "Magic-byte file identification engine: signature matching, ZIP compound sniffing, hashing, recursive scanning, CLI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"

[[bin]]
name = "filetypeid"
path = "src/main_cli.rs"
