[package]
name = "filetypeid-app"
version = "0.1.0"
edition = "2021"
description = "Magic-Byte File Identifier — Windows GUI + CLI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fid-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "filetypeid"
path = "src/main.rs"
